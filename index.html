<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaiPai</title>
<meta name="description" content="Your own AI at home, a robot companion, and apps to reach them anywhere, all on your own hardware, never the cloud.">
<link rel="icon" href="https://raw.githubusercontent.com/getmaipai/.github/main/brand/maipai-brand-icon.png">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display: flex; min-height: 100vh; align-items: center; justify-content: center;
         background: #ffffff; color: #1a1a2e; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0f0f17; color: #f2f2f7; } }
  main { padding: 2rem; max-width: 34rem; }
  img.logo { width: min(320px, 80vw); height: auto; }
  p.pitch { font-size: 1.1rem; line-height: 1.6; margin: 1.5rem 0 2rem; }
  .buttons a { display: inline-block; margin: 0.4rem; padding: 0.8rem 1.4rem; border-radius: 999px;
               text-decoration: none; font-weight: 600; }
  a.primary { background: #6d28d9; color: #ffffff; }
  a.secondary { border: 2px solid #6d28d9; color: #6d28d9; }
  @media (prefers-color-scheme: dark) { a.secondary { color: #b794f6; border-color: #b794f6; } }
  footer { margin-top: 2.5rem; font-size: 0.85rem; opacity: 0.7; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/getmaipai/.github/main/brand/maipai-brand-logo-dark.png">
    <img class="logo" src="https://raw.githubusercontent.com/getmaipai/.github/main/brand/maipai-brand-logo-light.png" alt="MaiPai">
  </picture>
  <p class="pitch">Your own AI at home, a robot companion, and apps to reach them anywhere, all on your own hardware, never the cloud.</p>
  <div class="buttons">
    <a class="primary" href="https://getmaipai.github.io/home/">MaiPai Home documentation</a>
    <a class="secondary" href="https://github.com/getmaipai">GitHub</a>
  </div>
  <footer>Say it like "my pie". Built by <a href="https://github.com/JesseWebDotCom">Jesse Torres</a>. No cookies, no tracking, nothing collected.</footer>
</main>
</body>
</html>
