<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Inter, system-ui, sans-serif">
  <style>
    .box { fill: none; stroke: #8b8b93; stroke-width: 2; rx: 8; }
    .label { fill: #8b8b93; font-size: 15px; font-weight: 600; }
    .small { fill: #8b8b93; font-size: 12.5px; }
    .accent { stroke: #e08a3c; }
    .accentfill { fill: #e08a3c; }
  </style>
  <!-- Stack -->
  <rect class="box" x="20" y="60" width="180" height="180" rx="8"/>
  <text class="label" x="110" y="45" text-anchor="middle">The compute stack</text>
  <rect x="40" y="180" width="140" height="36" rx="4" fill="none" stroke="#8b8b93"/>
  <text class="small" x="110" y="203" text-anchor="middle">UPS HAT (E)</text>
  <rect x="40" y="138" width="140" height="36" rx="4" fill="none" stroke="#8b8b93"/>
  <text class="small" x="110" y="161" text-anchor="middle">Raspberry Pi 5</text>
  <rect x="40" y="96" width="140" height="36" rx="4" fill="none" stroke="#8b8b93"/>
  <text class="small" x="110" y="119" text-anchor="middle">AI HAT+ 2</text>
  <!-- pins on top -->
  <g class="accent" stroke-width="2">
    <line x1="60" y1="96" x2="60" y2="80"/><line x1="72" y1="96" x2="72" y2="80"/>
    <line x1="84" y1="96" x2="84" y2="80"/><line x1="96" y1="96" x2="96" y2="80"/>
    <line x1="108" y1="96" x2="108" y2="80"/><line x1="120" y1="96" x2="120" y2="80"/>
    <line x1="132" y1="96" x2="132" y2="80"/><line x1="144" y1="96" x2="144" y2="80"/>
  </g>
  <text class="small accentfill" x="110" y="72" text-anchor="middle">pin strips pressed into the HAT's socket</text>
  <!-- ribbon -->
  <path d="M 200 114 C 260 114, 260 150, 320 150" fill="none" stroke="#e08a3c" stroke-width="10" opacity="0.75"/>
  <text class="small" x="258" y="105" text-anchor="middle">40-pin ribbon</text>
  <text class="small" x="258" y="188" text-anchor="middle">stripe (pin 1) at the</text>
  <text class="small" x="258" y="203" text-anchor="middle">SD-card corner</text>
  <!-- T board -->
  <rect class="box" x="320" y="110" width="200" height="80"/>
  <text class="label" x="420" y="95" text-anchor="middle">GPIO extension board</text>
  <text class="small" x="420" y="140" text-anchor="middle">the black T-shaped board;</text>
  <text class="small" x="420" y="156" text-anchor="middle">ribbon plugs into its keyed socket,</text>
  <text class="small" x="420" y="172" text-anchor="middle">every pin labeled (GPIO19, 3V3, GND...)</text>
  <!-- legs into breadboard -->
  <g class="accent" stroke-width="2">
    <line x1="360" y1="190" x2="360" y2="215"/><line x1="390" y1="190" x2="390" y2="215"/>
    <line x1="420" y1="190" x2="420" y2="215"/><line x1="450" y1="190" x2="450" y2="215"/>
    <line x1="480" y1="190" x2="480" y2="215"/>
  </g>
  <!-- breadboard -->
  <rect class="box" x="320" y="215" width="200" height="70"/>
  <text class="small" x="420" y="243" text-anchor="middle">breadboard (the white board);</text>
  <text class="small" x="420" y="259" text-anchor="middle">jumper wires go in the row</text>
  <text class="small" x="420" y="275" text-anchor="middle">beside each label</text>
  <text class="label" x="420" y="312" text-anchor="middle">Bench only</text>
  <!-- wires out to parts -->
  <g stroke="#8b8b93" stroke-width="2" fill="none">
    <path d="M 520 230 C 570 230, 570 90, 620 90"/>
    <path d="M 520 245 C 575 245, 575 155, 620 155"/>
    <path d="M 520 260 C 575 260, 575 220, 620 220"/>
    <path d="M 520 275 C 570 275, 570 285, 620 285"/>
  </g>
  <rect class="box" x="620" y="70" width="270" height="40"/>
  <text class="small" x="755" y="95" text-anchor="middle">2 eyes (SPI: GPIO 6, 7, 8, 10, 11, 25 + 3V3)</text>
  <rect class="box" x="620" y="135" width="270" height="40"/>
  <text class="small" x="755" y="160" text-anchor="middle">mouth (GPIO 19, via the level shifter, 5 V)</text>
  <rect class="box" x="620" y="200" width="270" height="40"/>
  <text class="small" x="755" y="225" text-anchor="middle">pan-tilt (I2C: GPIO 2, 3 + servo 5 V)</text>
  <rect class="box" x="620" y="265" width="270" height="40"/>
  <text class="small" x="755" y="290" text-anchor="middle">shutter switch (GPIO 16 + GND)</text>
</svg>
